<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Kawaii Table Tennis 3D 🏓🌸 — Cute Ping Pong</title>
  <script src="arcade-leaderboard.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --primary: #ff6b9d;
      --secondary: #4deeea;
      --accent: #ffe66d;
      --bg: #1a1528;
      --panel: rgba(30, 24, 48, 0.88);
      --text: #fff;
    }
    * { margin:0; padding:0; box-sizing:border-box; touch-action:none; user-select:none; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      cursor: grab;
    }
    body:active { cursor: grabbing; }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    canvas#webgl-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Top HUD Header */
    .hud-header {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 50;
    }
    .score-card {
      background: var(--panel);
      backdrop-filter: blur(14px);
      border: 2px solid rgba(255, 107, 157, 0.4);
      border-radius: 18px;
      padding: 10px 22px;
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5), 0 0 15px rgba(255,107,157,0.2);
      pointer-events: auto;
    }
    .player-score-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .score-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #bfa8d8;
    }
    .score-val {
      font-size: 26px;
      font-weight: 900;
      color: var(--secondary);
      text-shadow: 0 0 12px rgba(77, 238, 234, 0.6);
    }
    .score-val.you { color: var(--primary); text-shadow: 0 0 12px rgba(255, 107, 157, 0.6); }
    .vs-divider {
      font-size: 14px;
      font-weight: 900;
      color: var(--accent);
    }

    /* Rally Combo Counter */
    .rally-badge {
      background: rgba(255, 230, 109, 0.2);
      border: 2px solid var(--accent);
      color: var(--accent);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      text-shadow: 0 0 8px rgba(255, 230, 109, 0.5);
    }

    .top-actions {
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }
    .arcade-btn {
      background: var(--panel);
      border: 2px solid rgba(255, 107, 157, 0.5);
      color: #fff;
      padding: 8px 18px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      transition: all 0.2s;
    }
    .arcade-btn:hover {
      background: var(--primary);
      box-shadow: 0 0 20px rgba(255, 107, 157, 0.8);
      transform: translateY(-2px);
    }

    /* Modal Screens */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(14, 10, 24, 0.88);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-card {
      background: var(--panel);
      border: 2px solid rgba(255, 107, 157, 0.5);
      border-radius: 24px;
      padding: 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0,0,0,0.7), 0 0 30px rgba(255,107,157,0.3);
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-title {
      font-size: 32px;
      font-weight: 900;
      color: var(--primary);
      text-shadow: 0 0 16px rgba(255, 107, 157, 0.6);
      letter-spacing: -0.5px;
    }
    .modal-desc {
      color: #d1c4e9;
      font-size: 15px;
      line-height: 1.5;
    }
    .primary-btn {
      background: linear-gradient(135deg, #ff6b9d, #ff8da1);
      color: #fff;
      border: none;
      padding: 14px 28px;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(255, 107, 157, 0.5);
      transition: all 0.2s;
    }
    .primary-btn:hover {
      transform: scale(1.04);
      box-shadow: 0 12px 30px rgba(255, 107, 157, 0.8);
    }

    /* Controls Hint Toast */
    .controls-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      color: #e0d4f7;
      pointer-events: none;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="webgl-canvas"></canvas>

    <!-- Top HUD Header -->
    <div class="hud-header">
      <div class="score-card">
        <div class="player-score-box">
          <span class="score-label">🌸 YOU</span>
          <span id="score-player" class="score-val you">0</span>
        </div>
        <span class="vs-divider">VS</span>
        <div class="player-score-box">
          <span class="score-label">🤖 CPU</span>
          <span id="score-cpu" class="score-val">0</span>
        </div>
        <div class="rally-badge">
          ⚡ RALLY: <span id="rally-count">0</span>
        </div>
      </div>

      <div class="top-actions">
        <a href="https://marcuscaiado.github.io/marcus-arcade/" class="arcade-btn">
          🕹️ <span>Arcade Hub</span>
        </a>
      </div>
    </div>

    <div class="controls-hint">
      <span>🖱️ Drag Mouse / Swipe to move paddle • Hit corners for curve smash! ⚡</span>
    </div>

    <!-- Start / Game Over Modal -->
    <div id="start-modal" class="modal-overlay">
      <div class="modal-card">
        <h1 class="modal-title">KAWAII PONG 3D 🏓🌸</h1>
        <p class="modal-desc">
          Super cute 3D table tennis! Play against the sweet AI bot. Score 7 points to win the championship match!
        </p>
        <button class="primary-btn" onclick="startMatch()">PLAY MATCH ➔</button>
      </div>
    </div>

    <!-- Game Over Modal -->
    <div id="gameover-modal" class="modal-overlay" style="display: none;">
      <div class="modal-card">
        <h1 id="winner-title" class="modal-title">🎉 YOU WON!</h1>
        <p id="winner-desc" class="modal-desc">
          Incredible match! Highest rally: <b id="final-rally" style="color:var(--accent)">0</b> hits.
        </p>
        <button class="primary-btn" onclick="startMatch()">PLAY AGAIN ➔</button>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       1. SYNTHESIZED NINTENDO-STYLE CUTE AUDIO FX (Web Audio API)
       ========================================================================== */
    let audioCtx = null;
    function getAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }

    function playSound(type) {
      try {
        const ctx = getAudio();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        if (type === 'hit-paddle') {
          // Playful wooden ping pop
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(580, now);
          osc.frequency.exponentialRampToValueAtTime(840, now + 0.08);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'hit-table') {
          // Deep hollow table tap
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(140, now + 0.06);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.08);
        } else if (type === 'score-player') {
          // Happy chime arpeggio
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.type = 'sine';
            o.frequency.setValueAtTime(freq, now + i * 0.08);
            g.gain.setValueAtTime(0.18, now + i * 0.08);
            g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.25);
            o.connect(g); g.connect(ctx.destination);
            o.start(now + i * 0.08); o.stop(now + i * 0.08 + 0.25);
          });
        } else if (type === 'score-cpu') {
          // Sad boing drop
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(360, now);
          osc.frequency.exponentialRampToValueAtTime(120, now + 0.28);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.3);
        }
      } catch (e) {}
    }

    /* ==========================================================================
       2. THREE.JS 3D SCENE & KAWAII TABLE TENNIS COURT
       ========================================================================== */
    const canvas = document.getElementById('webgl-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1528);
    scene.fog = new THREE.FogExp2(0x1a1528, 0.008);

    // Camera (Positioned behind player paddle looking down the cute court)
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 300);
    camera.position.set(0, 24, 42);
    camera.lookAt(0, 2, -4);

    // Warm, pastel Nintendo-style lighting
    const ambientLight = new THREE.AmbientLight(0xfff0f5, 0.85);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 1.1);
    sunLight.position.set(20, 45, 25);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 1024;
    sunLight.shadow.mapSize.height = 1024;
    scene.add(sunLight);

    const pinkFillLight = new THREE.PointLight(0xff6b9d, 1.2, 80);
    pinkFillLight.position.set(-20, 15, 0);
    scene.add(pinkFillLight);

    const cyanFillLight = new THREE.PointLight(0x4deeea, 1.0, 80);
    cyanFillLight.position.set(20, 15, -20);
    scene.add(cyanFillLight);

    // Table Dimensions
    const TABLE_WIDTH = 24;
    const TABLE_LENGTH = 44;
    const TABLE_HEIGHT = 8;
    const NET_HEIGHT = 2.4;

    // Build 3D Ping Pong Table
    function createTable() {
      const tableGroup = new THREE.Group();

      // Table Top (Pastel Sky-Blue with Rounded feel)
      const topGeo = new THREE.BoxGeometry(TABLE_WIDTH, 1.0, TABLE_LENGTH);
      const topMat = new THREE.MeshStandardMaterial({
        color: 0x3d70b2,
        roughness: 0.35,
        metalness: 0.05
      });
      const topMesh = new THREE.Mesh(topGeo, topMat);
      topMesh.position.y = TABLE_HEIGHT;
      topMesh.receiveShadow = true;
      tableGroup.add(topMesh);

      // White Border Lines & Center Line
      const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      
      // Center Divider Line
      const centerLineGeo = new THREE.PlaneGeometry(0.35, TABLE_LENGTH);
      const centerLine = new THREE.Mesh(centerLineGeo, lineMat);
      centerLine.rotation.x = -Math.PI / 2;
      centerLine.position.y = TABLE_HEIGHT + 0.51;
      tableGroup.add(centerLine);

      // Outer Edge Lines
      const edgeLineGeo1 = new THREE.PlaneGeometry(0.4, TABLE_LENGTH);
      const leftEdge = new THREE.Mesh(edgeLineGeo1, lineMat);
      leftEdge.rotation.x = -Math.PI / 2;
      leftEdge.position.set(-TABLE_WIDTH / 2 + 0.2, TABLE_HEIGHT + 0.51, 0);
      tableGroup.add(leftEdge);

      const rightEdge = new THREE.Mesh(edgeLineGeo1, lineMat);
      rightEdge.rotation.x = -Math.PI / 2;
      rightEdge.position.set(TABLE_WIDTH / 2 - 0.2, TABLE_HEIGHT + 0.51, 0);
      tableGroup.add(rightEdge);

      // Net Mesh
      const netGeo = new THREE.BoxGeometry(TABLE_WIDTH + 2, NET_HEIGHT, 0.2);
      const netMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.85,
        roughness: 0.5
      });
      const net = new THREE.Mesh(netGeo, netMat);
      net.position.set(0, TABLE_HEIGHT + NET_HEIGHT / 2 + 0.5, 0);
      net.castShadow = true;
      tableGroup.add(net);

      // Net Top White Ribbon
      const netRibbonGeo = new THREE.BoxGeometry(TABLE_WIDTH + 2.2, 0.3, 0.3);
      const netRibbon = new THREE.Mesh(netRibbonGeo, lineMat);
      netRibbon.position.set(0, TABLE_HEIGHT + NET_HEIGHT + 0.5, 0);
      tableGroup.add(netRibbon);

      // Cute Wooden Legs
      const legGeo = new THREE.CylinderGeometry(0.8, 0.8, TABLE_HEIGHT, 16);
      const legMat = new THREE.MeshStandardMaterial({ color: 0xffd166, roughness: 0.5 });
      
      [[-TABLE_WIDTH / 2 + 2, -TABLE_LENGTH / 2 + 3],
       [TABLE_WIDTH / 2 - 2, -TABLE_LENGTH / 2 + 3],
       [-TABLE_WIDTH / 2 + 2, TABLE_LENGTH / 2 - 3],
       [TABLE_WIDTH / 2 - 2, TABLE_LENGTH / 2 - 3]].forEach(([x, z]) => {
        const leg = new THREE.Mesh(legGeo, legMat);
        leg.position.set(x, TABLE_HEIGHT / 2, z);
        leg.castShadow = true;
        tableGroup.add(leg);
      });

      // Pastel Stadium Floor
      const floorGeo = new THREE.CircleGeometry(65, 48);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x241d38, roughness: 0.8 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = 0;
      floor.receiveShadow = true;
      tableGroup.add(floor);

      scene.add(tableGroup);
    }
    createTable();

    /* ==========================================================================
       3. KAWAII 3D PADDLES (With Cute Animated Eyes & Blush!)
       ========================================================================== */
    function createKawaiiPaddle(isPlayer = true) {
      const paddleGroup = new THREE.Group();

      // Circular Rubber Blade
      const bladeColor = isPlayer ? 0xff4d79 : 0x00d2d3;
      const bladeGeo = new THREE.CylinderGeometry(2.4, 2.4, 0.45, 32);
      const bladeMat = new THREE.MeshStandardMaterial({
        color: bladeColor,
        roughness: 0.3,
        metalness: 0.1
      });
      const blade = new THREE.Mesh(bladeGeo, bladeMat);
      blade.rotation.x = Math.PI / 2;
      blade.castShadow = true;
      paddleGroup.add(blade);

      // Wooden Handle
      const handleGeo = new THREE.CylinderGeometry(0.45, 0.55, 3.2, 16);
      const handleMat = new THREE.MeshStandardMaterial({ color: 0xffd166, roughness: 0.4 });
      const handle = new THREE.Mesh(handleGeo, handleMat);
      handle.position.y = -3.2;
      handle.castShadow = true;
      paddleGroup.add(handle);

      // Cute Big Kawaii Eyes
      const eyeGeo = new THREE.SphereGeometry(0.35, 16, 16);
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
      const pupilGeo = new THREE.SphereGeometry(0.12, 12, 12);
      const pupilMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

      // Left Eye
      const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
      leftEye.position.set(-0.85, 0.3, 0.3);
      const leftPupil = new THREE.Mesh(pupilGeo, pupilMat);
      leftPupil.position.set(-0.06, 0.1, 0.25);
      leftEye.add(leftPupil);
      paddleGroup.add(leftEye);

      // Right Eye
      const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
      rightEye.position.set(0.85, 0.3, 0.3);
      const rightPupil = new THREE.Mesh(pupilGeo, pupilMat);
      rightPupil.position.set(0.06, 0.1, 0.25);
      rightEye.add(rightPupil);
      paddleGroup.add(rightEye);

      // Cute Pink Blush Cheeks
      const blushGeo = new THREE.CircleGeometry(0.32, 16);
      const blushMat = new THREE.MeshBasicMaterial({ color: 0xff9ec7, transparent: true, opacity: 0.85 });
      const leftBlush = new THREE.Mesh(blushGeo, blushMat);
      leftBlush.position.set(-1.3, -0.15, 0.3);
      paddleGroup.add(leftBlush);
      const rightBlush = new THREE.Mesh(blushGeo, blushMat);
      rightBlush.position.set(1.3, -0.15, 0.3);
      paddleGroup.add(rightBlush);

      scene.add(paddleGroup);
      return paddleGroup;
    }

    const playerPaddle = createKawaiiPaddle(true);
    playerPaddle.position.set(0, TABLE_HEIGHT + 2.5, TABLE_LENGTH / 2 - 2);

    const cpuPaddle = createKawaiiPaddle(false);
    cpuPaddle.position.set(0, TABLE_HEIGHT + 2.5, -TABLE_LENGTH / 2 + 2);
    cpuPaddle.rotation.y = Math.PI;

    /* ==========================================================================
       4. 3D PING PONG BALL WITH SQUASH & STRETCH BOUNCE
       ========================================================================== */
    const BALL_RADIUS = 0.85;
    const ballGeo = new THREE.SphereGeometry(BALL_RADIUS, 32, 32);
    const ballMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      emissive: 0xffe66d,
      emissiveIntensity: 0.2,
      roughness: 0.25,
      metalness: 0.1
    });
    const ballMesh = new THREE.Mesh(ballGeo, ballMat);
    ballMesh.castShadow = true;
    scene.add(ballMesh);

    // Ball Physics State
    const ball = {
      x: 0,
      y: TABLE_HEIGHT + 4,
      z: 0,
      vx: 0,
      vy: 0,
      vz: 0.45,
      gravity: -0.015,
      speed: 0.65,
      trailTimer: 0
    };

    function resetBall(serveToPlayer = true) {
      ball.x = 0;
      ball.y = TABLE_HEIGHT + 4;
      ball.z = serveToPlayer ? -6 : 6;
      ball.vx = (Math.random() - 0.5) * 0.15;
      ball.vy = 0.15;
      ball.vz = serveToPlayer ? 0.48 : -0.48;
      ball.speed = 0.55;
      currentRally = 0;
      updateRallyDisplay();
    }

    /* ==========================================================================
       5. GAME STATE & SCORING
       ========================================================================== */
    let playerScore = 0;
    let cpuScore = 0;
    let currentRally = 0;
    let maxRally = 0;
    let isMatchRunning = false;
    const WINNING_SCORE = 7;

    // Pointer Input
    let targetPaddleX = 0;
    let targetPaddleY = TABLE_HEIGHT + 2.5;

    function handlePointer(clientX, clientY) {
      const normX = (clientX / window.innerWidth) * 2 - 1;
      const normY = -(clientY / window.innerHeight) * 2 + 1;
      targetPaddleX = normX * (TABLE_WIDTH / 2 - 1.5);
      targetPaddleY = THREE.MathUtils.clamp(TABLE_HEIGHT + 1.2 + (normY + 0.5) * 4, TABLE_HEIGHT + 0.8, TABLE_HEIGHT + 6.5);
    }

    window.addEventListener('mousemove', (e) => handlePointer(e.clientX, e.clientY));
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        handlePointer(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: false });

    function startMatch() {
      playerScore = 0;
      cpuScore = 0;
      currentRally = 0;
      maxRally = 0;
      updateScoreboard();
      updateRallyDisplay();
      document.getElementById('start-modal').style.display = 'none';
      document.getElementById('gameover-modal').style.display = 'none';
      isMatchRunning = true;
      resetBall(true);
    }

    function updateScoreboard() {
      document.getElementById('score-player').textContent = playerScore;
      document.getElementById('score-cpu').textContent = cpuScore;
    }

    function updateRallyDisplay() {
      document.getElementById('rally-count').textContent = currentRally;
    }

    function checkMatchWinner() {
      if (playerScore >= WINNING_SCORE || cpuScore >= WINNING_SCORE) {
        isMatchRunning = false;
        const playerWon = playerScore >= WINNING_SCORE;
        document.getElementById('winner-title').textContent = playerWon ? '🎉 YOU WON THE MATCH!' : '💔 CPU WON!';
        document.getElementById('winner-desc').innerHTML = playerWon 
          ? `Incredible reflexes! Highest rally: <b style="color:var(--accent)">${maxRally}</b> hits.`
          : `Good game! Highest rally: <b style="color:var(--accent)">${maxRally}</b> hits. Try again!`;
        document.getElementById('gameover-modal').style.display = 'flex';
      }
    }

    /* ==========================================================================
       6. GAME ANIMATION LOOP & PHYSICS UPDATE
       ========================================================================== */
    function animate() {
      requestAnimationFrame(animate);

      if (isMatchRunning) {
        // 1. Move Player Paddle with Spring Lerp
        playerPaddle.position.x += (targetPaddleX - playerPaddle.position.x) * 0.22;
        playerPaddle.position.y += (targetPaddleY - playerPaddle.position.y) * 0.22;
        playerPaddle.rotation.z = (playerPaddle.position.x - targetPaddleX) * 0.08;

        // 2. Intelligent & Cute CPU Paddle AI
        const cpuTargetX = THREE.MathUtils.clamp(ball.x + (Math.sin(Date.now() * 0.005) * 0.5), -TABLE_WIDTH / 2 + 2, TABLE_WIDTH / 2 - 2);
        const cpuTargetY = THREE.MathUtils.clamp(ball.y, TABLE_HEIGHT + 1.2, TABLE_HEIGHT + 5);
        cpuPaddle.position.x += (cpuTargetX - cpuPaddle.position.x) * 0.12;
        cpuPaddle.position.y += (cpuTargetY - cpuPaddle.position.y) * 0.12;
        cpuPaddle.rotation.z = -(cpuPaddle.position.x - cpuTargetX) * 0.08;

        // 3. Ball Physics & Gravity
        ball.vy += ball.gravity;
        ball.x += ball.vx;
        ball.y += ball.vy;
        ball.z += ball.vz;

        // Table Surface Bounce
        const tableTopY = TABLE_HEIGHT + 0.5 + BALL_RADIUS;
        if (ball.y <= tableTopY && Math.abs(ball.x) <= TABLE_WIDTH / 2 && Math.abs(ball.z) <= TABLE_LENGTH / 2) {
          ball.y = tableTopY;
          ball.vy = Math.abs(ball.vy) * 0.88 + 0.08; // Bouncy pop
          playSound('hit-table');
        }

        // Side Table Boundary Deflection
        if (Math.abs(ball.x) >= TABLE_WIDTH / 2 + 1) {
          ball.vx *= -0.7;
        }

        // 4. Paddle Collisions
        // Player Hit
        const pDistZ = ball.z - playerPaddle.position.z;
        const pDistX = ball.x - playerPaddle.position.x;
        const pDistY = ball.y - playerPaddle.position.y;

        if (ball.vz > 0 && Math.abs(pDistZ) < 1.4 && Math.abs(pDistX) < 3.2 && Math.abs(pDistY) < 3.2) {
          ball.vz = -Math.abs(ball.speed);
          ball.vx = pDistX * 0.18; // Aiming angle based on paddle hit spot!
          ball.vy = 0.22;
          ball.speed = Math.min(1.15, ball.speed + 0.03); // Escalating rally pace!
          currentRally++;
          maxRally = Math.max(maxRally, currentRally);
          updateRallyDisplay();
          playSound('hit-paddle');
        }

        // CPU Hit
        const cDistZ = ball.z - cpuPaddle.position.z;
        const cDistX = ball.x - cpuPaddle.position.x;
        const cDistY = ball.y - cpuPaddle.position.y;

        if (ball.vz < 0 && Math.abs(cDistZ) < 1.4 && Math.abs(cDistX) < 3.2 && Math.abs(cDistY) < 3.2) {
          ball.vz = Math.abs(ball.speed);
          ball.vx = cDistX * 0.18 + (Math.random() - 0.5) * 0.1;
          ball.vy = 0.22;
          ball.speed = Math.min(1.15, ball.speed + 0.03);
          currentRally++;
          maxRally = Math.max(maxRally, currentRally);
          updateRallyDisplay();
          playSound('hit-paddle');
        }

        // 5. Score Checking (Ball passed paddle)
        if (ball.z > TABLE_LENGTH / 2 + 10) {
          // CPU Scored
          cpuScore++;
          playSound('score-cpu');
          updateScoreboard();
          checkMatchWinner();
          if (isMatchRunning) resetBall(true);
        } else if (ball.z < -TABLE_LENGTH / 2 - 10) {
          // Player Scored!
          playerScore++;
          playSound('score-player');
          updateScoreboard();
          checkMatchWinner();
          if (isMatchRunning) resetBall(false);
        }

        // Update 3D Ball Mesh
        ballMesh.position.set(ball.x, ball.y, ball.z);
        ballMesh.rotation.x += ball.vz * 0.2;
        ballMesh.rotation.z -= ball.vx * 0.2;
      }

      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    // Responsive Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
